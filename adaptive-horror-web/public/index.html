<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Horror — Integration Starter</title><script src="/aframe.js"></script>
<style>body{margin:0;font:14px system-ui}#panel{position:fixed;z-index:10;top:12px;left:12px;max-width:340px;padding:16px;background:#101820ed;color:#fff;border-radius:10px}label{display:block;margin:10px 0}input{width:100%}button,select{padding:8px}small{display:block;margin-top:8px;color:#bbcbd5}</style></head>
<body>
<section id="panel"><strong>Adaptive horror · starter</strong>
<label>Input <select id="mode"><option value="manual">MANUAL DEMO</option><option value="stream">Live stream</option></select></label>
<label>Manual intensity <input id="intensity" type="range" min="0" max="1" step=".01" value=".5"></label>
<label><input style="width:auto" id="quality" type="checkbox" checked> Good signal quality (manual)</label>
<button id="sound">Enable sound</button><button id="reset">Reset director</button>
<p id="status">Loading…</p><small>Experimental response input. No emotion classification. Desktop: drag to look; WASD to move. In VR, use the right controller trigger to start/stop sound.</small></section>
<a-scene background="color: #080b10" fog="type: exponential; color: #111620; density: 0.025" renderer="antialias: true">
  <a-entity light="type: ambient; color: #8ba2c2; intensity: .15"></a-entity>
  <a-entity id="lamp" position="0 2.8 -2" light="type: point; color: #b8cce5; intensity: 1; distance: 12"></a-entity>
  <a-plane rotation="-90 0 0" width="8" height="10" color="#303943" position="0 0 -2"></a-plane>
  <a-box position="-4 1.5 -2" width=".2" height="3" depth="10" color="#222936"></a-box>
  <a-box position="4 1.5 -2" width=".2" height="3" depth="10" color="#222936"></a-box>
  <a-box position="0 1.5 -7" width="8" height="3" depth=".2" color="#222936"></a-box>
  <a-box position="0 3 -2" width="8" height=".1" depth="10" color="#191d25"></a-box>
  <a-box position="-2 .5 -4" width="1.2" height="1" depth="1" color="#414956"></a-box>
  <a-entity id="shadow" position="2 0 -5" visible="false">
    <a-cylinder radius=".22" height="1.3" position="0 .8 0" color="#020204"></a-cylinder>
    <a-sphere radius=".19" position="0 1.65 0" color="#020204"></a-sphere>
  </a-entity>
  <a-entity id="rig" position="0 0 1">
    <a-camera><a-text id="hud" position="-.42 -.27 -.85" width="1" color="#c8f5e5" value="MANUAL DEMO"></a-text></a-camera>
    <a-entity laser-controls="hand: left"></a-entity>
    <a-entity id="right-hand" laser-controls="hand: right"></a-entity>
  </a-entity>
</a-scene><script type="module" src="/app.mjs"></script></body></html>
