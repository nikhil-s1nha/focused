<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">DREADLOOP — The room reacts.</title>
  <desc id="desc">Editorial concept illustration for a spatial computing prototype. An abstract live signal becomes the illuminated threshold of a dark geometric corridor. Signal Scope and adaptive horror in WebXR, with live signals, adaptive encounters, and remote start and stop.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101619"/>
      <stop offset=".57" stop-color="#080d0f"/>
      <stop offset="1" stop-color="#0e1919"/>
    </linearGradient>
    <radialGradient id="ambient" cx=".79" cy=".48" r=".49">
      <stop stop-color="#517f70" stop-opacity=".19"/>
      <stop offset=".59" stop-color="#254b43" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0b1012" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#122823" stop-opacity=".05"/>
      <stop offset="1" stop-color="#5ba28a" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#76bfa7" stop-opacity=".28"/>
      <stop offset=".34" stop-color="#b4f7d9"/>
      <stop offset="1" stop-color="#d4fff0"/>
    </linearGradient>
    <linearGradient id="threshold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ddfff2"/>
      <stop offset="1" stop-color="#83dcb9" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".17" stop-color="white" stop-opacity=".16"/>
      <stop offset=".38" stop-color="white"/>
    </linearGradient>
    <mask id="corridorMask"><rect x="790" y="0" width="810" height="650" fill="url(#leftFade)"/></mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".65" fill="#b4d2c7" opacity=".09"/>
    </pattern>
  </defs>

  <rect width="1600" height="650" rx="18" fill="url(#backdrop)"/>
  <rect width="1600" height="650" rx="18" fill="url(#ambient)"/>
  <rect x="1" y="1" width="1598" height="648" rx="17" fill="none" stroke="#75998a" stroke-opacity=".18"/>
  <rect x="1" y="1" width="1598" height="648" rx="17" fill="url(#grain)"/>

  <!-- The room: a quiet, architectural vanishing point. -->
  <g mask="url(#corridorMask)">
    <path d="M832 650 1193 419H1385L1600 650Z" fill="url(#floor)"/>
    <g fill="none" stroke="#7fa492" stroke-opacity=".18" stroke-width="1.2">
      <path d="M818 38 1193 236M1600 22 1385 236M790 650 1193 419M1600 650 1385 419"/>
      <path d="M935 99H1523V568H935Z"/>
      <path d="M1031 151H1471V514H1031Z"/>
      <path d="M1102 187H1434V475H1102Z"/>
      <path d="M1154 215H1406V444H1154Z"/>
      <path d="M1193 236H1385V419H1193Z"/>
      <path d="M1217 260H1361V398H1217Z" stroke-opacity=".12"/>
      <path d="M1239 283H1339V377H1239Z" stroke-opacity=".08"/>
      <path d="M864 602H1568M994 535H1508M1082 486H1446M1143 450H1411"/>
      <path d="M1062 650 1246 419M1342 650 1309 419M1489 650 1346 419"/>
      <path d="M1062 0 1246 236M1342 0 1309 236M1489 0 1346 236" stroke-opacity=".09"/>
    </g>
    <path d="M1193 419V236H1385V419" fill="none" stroke="#b6ffdb" stroke-width="10" opacity=".19" filter="url(#glow)"/>
    <path d="M1193 419V236H1385V419" fill="none" stroke="url(#threshold)" stroke-width="2.3"/>
    <path d="M1199 413V242H1379V413" fill="none" stroke="#b4f7d9" stroke-opacity=".12"/>
    <path d="M1193 419H1385" stroke="#b4f7d9" stroke-opacity=".22"/>
    <rect x="1254" y="289" width="70" height="130" fill="#070c0e"/>
    <path d="M1254 419V289H1324" stroke="#659e8c" stroke-opacity=".29" fill="none"/>
    <path d="M1324 289V419" stroke="#c0f9e0" stroke-opacity=".44"/>
    <path d="M1325 290 1330 298V419H1325Z" fill="#b3e7d3" opacity=".08"/>
    <path d="M1324 419 1428 650H1389L1316 419Z" fill="#b4f7d9" opacity=".025"/>
    <circle cx="1312" cy="357" r="1.8" fill="#b4f7d9" opacity=".65"/>
  </g>

  <!-- Signal is deliberately illustrative, not a recording or inference. -->
  <path d="M92 438H249L265 434 280 441 295 437H329L341 425 353 451 367 435H402L415 441 429 436H474L486 424 499 450 515 438H548L560 431 574 443 590 437H634L650 421 664 456 681 438H722L736 430 750 444 767 438H811L829 409 846 469 865 438H906L922 425 939 449 956 438H1010L1026 402 1044 477 1064 438H1101L1118 426 1134 448 1150 438H1174L1193 419" fill="none" stroke="#a4e9cd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".10" filter="url(#glow)"/>
  <path d="M92 438H249L265 434 280 441 295 437H329L341 425 353 451 367 435H402L415 441 429 436H474L486 424 499 450 515 438H548L560 431 574 443 590 437H634L650 421 664 456 681 438H722L736 430 750 444 767 438H811L829 409 846 469 865 438H906L922 425 939 449 956 438H1010L1026 402 1044 477 1064 438H1101L1118 426 1134 448 1150 438H1174L1193 419" fill="none" stroke="url(#signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 438H1150" stroke="#9acdb7" stroke-opacity=".12" stroke-dasharray="2 9"/>
  <circle cx="1193" cy="419" r="4" fill="#c8ffe8"/>

  <!-- Editorial masthead and typography use only local system fallbacks. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="60" width="7" height="7" rx="1" fill="#b3f2d5"/>
    <text x="115" y="69" font-family="'Courier New', monospace" font-size="13" letter-spacing="2.1" fill="#91afa3">MOLTEN 2026 · SPATIAL COMPUTING PROTOTYPE</text>
    <text x="86" y="232" font-size="115" font-weight="800" letter-spacing="-6" fill="#eaf3ee">DREADLOOP</text>
    <text x="92" y="309" font-size="49" font-weight="400" letter-spacing="-1.8" fill="#b9f5d8">The room reacts.</text>
    <text x="94" y="360" font-size="22" letter-spacing=".1" fill="#9cafa7">Signal Scope × adaptive horror in WebXR</text>

    <g font-family="'Courier New', monospace" font-size="11" letter-spacing="1.4" fill="#789c8c">
      <text x="1192" y="205">02 / SPATIAL RESPONSE</text>
      <text x="94" y="483">01 / LIVE INPUT</text>
    </g>

    <g font-size="15" fill="#bdcec5">
      <rect x="92" y="542" width="152" height="40" rx="20" fill="#a1d8bb" fill-opacity=".035" stroke="#719e87" stroke-opacity=".25"/>
      <circle cx="114" cy="562" r="3" fill="#9de0bf"/>
      <text x="128" y="567">Live signals</text>
      <rect x="256" y="542" width="198" height="40" rx="20" fill="#a1d8bb" fill-opacity=".035" stroke="#719e87" stroke-opacity=".25"/>
      <text x="277" y="567">Adaptive encounters</text>
      <rect x="466" y="542" width="207" height="40" rx="20" fill="#a1d8bb" fill-opacity=".035" stroke="#719e87" stroke-opacity=".25"/>
      <text x="487" y="567">Remote start + stop</text>
    </g>
    <text x="1507" y="610" text-anchor="end" font-family="'Courier New', monospace" font-size="10" letter-spacing="1" fill="#617e71">CONCEPT ILLUSTRATION</text>
  </g>
</svg>
