<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="390" viewBox="0 0 1600 390" role="img" aria-labelledby="title desc">
  <title id="title">DREADLOOP — From signal to scene</title>
  <desc id="desc">Conceptual flow showing live input in Signal Scope, configurable thresholds, and an adaptive WebXR room. A separate remote control can start and stop a session. The diagram is an illustration, not a measured result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101719"/><stop offset="1" stop-color="#0a1112"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ca18e"/><stop offset="1" stop-color="#bbf4d8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 5 4 1 7" fill="none" stroke="#8dc1a8" stroke-width="1.2"/></marker>
  </defs>
  <rect x="1" y="1" width="1598" height="388" rx="16" fill="url(#bg)" stroke="#75998a" stroke-opacity=".2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="61" font-family="'Courier New', monospace" font-size="12" letter-spacing="2.2" fill="#8faf9e">DREADLOOP / THE INTERACTION</text>
    <text x="64" y="111" font-size="32" letter-spacing="-.7" font-weight="600" fill="#e3eee7">From signal to scene.</text>
    <text x="1535" y="61" text-anchor="end" font-family="'Courier New', monospace" font-size="10" letter-spacing="1" fill="#617e71">CONCEPT ILLUSTRATION</text>

    <g fill="#0d1918" stroke="#69977f" stroke-opacity=".26">
      <rect x="64" y="151" width="359" height="162" rx="8"/>
      <rect x="505" y="151" width="359" height="162" rx="8"/>
      <rect x="946" y="151" width="359" height="162" rx="8"/>
    </g>
    <g fill="none" stroke="url(#line)" stroke-width="1.5">
      <path d="M437 233H487" marker-end="url(#arrow)"/>
      <path d="M878 233H928" marker-end="url(#arrow)"/>
    </g>

    <g font-family="'Courier New', monospace" font-size="11" letter-spacing="1.3" fill="#6f9c86">
      <text x="86" y="181">01 / OBSERVE</text>
      <text x="527" y="181">02 / CONFIGURE</text>
      <text x="968" y="181">03 / RESPOND</text>
    </g>
    <g font-size="23" fill="#d7e9df" font-weight="600" letter-spacing="-.3">
      <text x="86" y="217">Signal Scope</text>
      <text x="527" y="217">Thresholds</text>
      <text x="968" y="217">Adaptive room</text>
    </g>
    <g font-size="14" fill="#829e90">
      <text x="86" y="241">Inspect the live input.</text>
      <text x="527" y="241">Tune the response.</text>
      <text x="968" y="241">Experience the encounter in WebXR.</text>
    </g>

    <path d="M87 282H134L142 276 151 288 162 281H185L194 262 204 297 215 282H250L258 275 267 287 279 282H312L321 268 332 294 344 282H400" fill="none" stroke="#a7e7c8" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M528 283H840" stroke="#729f88" stroke-opacity=".25"/>
    <path d="M528 270H840" stroke="#9bd4b7" stroke-opacity=".44" stroke-dasharray="4 6"/>
    <path d="M528 283H577L588 279 600 288 611 282H654L666 257 679 294 693 282H738L751 276 764 286 777 282H840" stroke="#a7e7c8" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
    <circle cx="666" cy="257" r="3" fill="#c7fbe0"/>
    <path d="M968 294 1004 268H1081L1117 294M1004 268V255H1081V268M985 282H1100M1004 268 1000 294M1081 268 1085 294" fill="none" stroke="#779f89" stroke-width="1.2" stroke-opacity=".5"/>
    <path d="M1023 287V256H1061V287" fill="none" stroke="#b4f2d2" stroke-width="1.8"/>
    <g fill="#a9d5be" opacity=".65"><circle cx="1171" cy="277" r="2"/><circle cx="1183" cy="277" r="2"/><circle cx="1195" cy="277" r="2"/></g>
    <path d="M1221 289V264H1247V289" fill="none" stroke="#81ae96" stroke-width="1.3"/>

    <path d="M1341 176V290" stroke="#698f7c" stroke-opacity=".27"/>
    <text x="1371" y="208" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.3" fill="#6f9c86">REMOTE CONTROL</text>
    <text x="1371" y="241" font-size="20" fill="#d7e9df">Start + stop</text>
    <rect x="1371" y="264" width="50" height="28" rx="14" fill="#9bd4b7" fill-opacity=".07" stroke="#86b89d" stroke-opacity=".3"/>
    <path d="m1393 272 8 6-8 6Z" fill="#abd7c0"/>
    <rect x="1432" y="264" width="50" height="28" rx="14" fill="#9bd4b7" fill-opacity=".07" stroke="#86b89d" stroke-opacity=".3"/>
    <rect x="1453" y="274" width="8" height="8" rx="1" fill="#abd7c0"/>
    <text x="64" y="354" font-size="12" fill="#6e8b7c">Live signals · configurable responses · spatial encounters</text>
  </g>
</svg>
